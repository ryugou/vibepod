name: CI

# Trigger model:
#   - pull_request: run only the `test` job for fast logic validation.
#   - push to main: also run the `build` matrix to catch any
#     platform-specific compile error before a release tag.
# release.yml owns the multi-platform build + publish at tag time.
on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claudeignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claudeignore'

# すべてのジョブは checkout してビルド/テストするだけで、PR コメントの投稿・
# リリース作成・パッケージ公開など GITHUB_TOKEN の書き込み権限を必要とする
# 操作は行わない。release.yml（`contents: write`、タグ時のみ）と異なり、
# ここでは読み取り専用に絞る。
permissions:
  contents: read

# Cancel any in-progress run for the same branch when a new commit is pushed,
# so back-to-back pushes don't pile up superseded runs (both the PR `test`
# job and any post-merge `build` matrix runs benefit from this).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  docker-integration:
    # `cargo test` alone never runs `#[ignore]` tests, so the docker-runtime
    # invariants in tests/container_integration_test.rs (nested ro/rw mount
    # stacking) and tests/docker_test.rs's ignored cases had never actually
    # executed in CI before this job existed. Kept as a separate job (not
    # folded into `test`, and not a `needs: test` dependency) so a docker
    # hiccup on the runner can never fail or block the fast non-docker
    # `test` job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - run: cargo test -- --ignored

  build:
    # Only run the multi-platform build matrix on push to main (post-merge),
    # not on every PR push. PR validation is handled by the `test` job above.
    if: github.event_name == 'push'
    needs: test
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}
